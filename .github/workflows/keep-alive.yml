name: Keep alive

on:
  schedule:
    # Every 10 minutes from 06:00 to 23:59 (UTC-5); Render free sleeps after 15 idle minutes.
    - cron: "*/10 0-4,11-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API
        env:
          API_URL: ${{ vars.KEEP_ALIVE_URL || 'https://decora-ia-backend.onrender.com/api/v1/hello' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$API_URL"
