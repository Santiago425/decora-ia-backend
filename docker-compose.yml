# Runs PostgreSQL and the API together: docker compose up --build
# Values come from .env (copy .env.example); DATABASE_URL is overridden to use the db service.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habita}
      POSTGRES_USER: ${POSTGRES_USER:-habita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habita}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habita} -d ${POSTGRES_DB:-habita}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-habita}:${POSTGRES_PASSWORD:-habita}@db:5432/${POSTGRES_DB:-habita}
      STORAGE_PROVIDER: database
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
